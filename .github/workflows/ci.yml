name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  ODIN3_WHEEL: https://github.com/drpaj12/odin3/releases/download/v1.0.0/odin3-1.0.0-py3-none-linux_x86_64.whl

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Drafts skip CI. A PR touching only docs/** and *.md reports code=false, so build/test jobs skip
    # (a skipped job satisfies a required check); the docs job still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|.*\.md$)'; then code=true; else code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cffi "$ODIN3_WHEEL" PySide6 ruff mypy -e .
      - run: ruff check .
      - run: mypy --strict verdandi tests

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The Odin III wheel and source are pinned to v1.0.0; ABC tests skip without a binary.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: drpaj12/odin3
          ref: v1.0.0
          path: odin3-src
      - run: sudo apt-get update && sudo apt-get install -y graphviz libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install cffi "$ODIN3_WHEEL" PySide6 ruff mypy -e .
      - run: python -c "import odin3; print(odin3.default().version())"
      - run: python -m unittest discover -s tests -t . -v
        env:
          ODIN3_ROOT: ${{ github.workspace }}/odin3-src
          QT_QPA_PLATFORM: offscreen
